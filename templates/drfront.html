<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Dr AI | Medical Intelligence</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #070c18;
            color: white;
            overflow-x: hidden;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .auth-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            background:
                radial-gradient(
                    circle at 15% 50%,
                    rgba(55, 120, 255, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(124, 92, 232, 0.10),
                    transparent 35%
                ),
                #070c18;
        }


        /* =====================================================
           LEFT / DOCTOR PANEL
           ===================================================== */

        .left-panel {
            width: 50%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(65, 125, 255, 0.14),
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #101a2d,
                    #080e1b
                );

            border-right: 1px solid rgba(148, 163, 184, 0.10);
        }


        /* glowing circles */

        .left-panel::before {
            content: "";

            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background: rgba(64, 123, 255, 0.12);

            filter: blur(90px);

            animation: glowOne 6s ease-in-out infinite;
        }

        .left-panel::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background: rgba(124, 92, 232, 0.14);

            filter: blur(80px);

            right: -70px;
            bottom: -60px;

            animation: glowTwo 7s ease-in-out infinite;
        }


        /* =====================================================
           BRAND ON LEFT
           ===================================================== */

        .brand-box {
            position: absolute;

            top: 35px;
            left: 42px;

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 5;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;

            background:
                linear-gradient(
                    135deg,
                    #4f8cff,
                    #7c5ce8
                );

            box-shadow:
                0 10px 30px rgba(79, 140, 255, 0.25);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 9px;

            color: #75829a;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        /* =====================================================
           DOCTOR IMAGE
           ===================================================== */

        .doctor-wrap {
            position: relative;

            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
        }

        .doctor-glow {
            position: absolute;

            width: 360px;
            height: 360px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(79, 140, 255, 0.16),
                    transparent 65%
                );

            filter: blur(10px);
        }

        .left-panel img {
            position: relative;

            z-index: 4;

            display: block;

            width: min(65%, 430px);

            max-width: 430px;

            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(0 25px 45px rgba(0, 0, 0, 0.45));

            animation: doctorFloat 5s ease-in-out infinite;

            transition: transform 0.4s ease;
        }

        .left-panel img:hover {
            transform: scale(1.04);
        }


        /* =====================================================
           LEFT TEXT
           ===================================================== */

        .doctor-caption {
            position: absolute;

            bottom: 50px;

            z-index: 5;

            text-align: center;
        }

        .doctor-caption h2 {
            font-size: 25px;

            margin-bottom: 6px;

            font-weight: 700;
        }

        .doctor-caption p {
            color: #8290aa;

            font-size: 12px;

            letter-spacing: 1px;
        }

        .status-line {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 10px;

            color: #20d99b;

            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #20d99b;

            box-shadow:
                0 0 12px #20d99b;
        }


        /* =====================================================
           RIGHT PANEL
           ===================================================== */

        .right-panel {
            width: 50%;
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 35px;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 80% 15%,
                    rgba(124, 92, 232, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #111a2b,
                    #090f1d
                );
        }


        .right-panel::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(79, 140, 255, 0.07);

            filter: blur(80px);

            top: -120px;
            right: -100px;
        }


        /* =====================================================
           LOGIN BOX
           ===================================================== */

        .login-box {
            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 410px;

            padding: 40px 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(24, 34, 53, 0.92),
                    rgba(14, 22, 38, 0.94)
                );

            border: 1px solid rgba(148, 163, 184, 0.14);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.03);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: loginAppear 0.7s ease;
        }


        /* top gradient */

        .login-box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;

            width: 76%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #4f8cff,
                    #7c5ce8,
                    transparent
                );

            border-radius: 20px;
        }


        /* =====================================================
           LOGIN HEADER
           ===================================================== */

        .login-header {
            margin-bottom: 25px;
        }

        .login-icon {
            width: 48px;
            height: 48px;

            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 22px;

            background:
                linear-gradient(
                    135deg,
                    #4f8cff,
                    #7c5ce8
                );

            box-shadow:
                0 12px 30px rgba(79, 140, 255, 0.22);
        }

        .login-box h3 {
            margin: 0 0 7px;

            font-size: 27px;

            font-weight: 700;

            color: #ffffff;
        }

        .login-box .subtitle {
            margin: 0;

            font-size: 13px;

            color: #8390a7;
        }


        /* =====================================================
           INPUTS
           ===================================================== */

        .input-group-custom {
            position: relative;

            margin-bottom: 14px;
        }

        .input-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;

            font-size: 14px;

            z-index: 2;
        }

        .form-control {
            width: 100%;

            height: 50px;

            padding: 12px 15px 12px 43px;

            border-radius: 13px;

            border: 1px solid rgba(148, 163, 184, 0.14);

            background: rgba(15, 23, 42, 0.82);

            color: #ffffff;

            font-size: 13px;

            outline: none;

            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #617089;
        }

        .form-control:focus {
            color: #ffffff;

            background: rgba(15, 23, 42, 0.98);

            border-color: #4f8cff;

            box-shadow:
                0 0 0 3px rgba(79, 140, 255, 0.09),
                0 8px 25px rgba(0, 0, 0, 0.15);
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .btn-login {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #4f8cff,
                    #7c5ce8
                );

            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            position: relative;

            overflow: hidden;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(79, 140, 255, 0.20);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .btn-login::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: 0.6s ease;
        }

        .btn-login:hover::before {
            left: 140%;
        }

        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(79, 140, 255, 0.30);

            color: white;
        }

        .btn-login:active {
            transform: scale(0.98);
        }


        /* =====================================================
           TOGGLE
           ===================================================== */

        .toggle {
            margin-top: 20px;

            font-size: 11px;

            color: #77849a;
        }

        .toggle span {
            cursor: pointer;

            color: #70a5ff;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .toggle span:hover {
            color: #a78bfa;
        }


        /* =====================================================
           SECURITY TEXT
           ===================================================== */

        .security-note {
            margin-top: 22px;

            padding-top: 16px;

            border-top: 1px solid rgba(148, 163, 184, 0.08);

            text-align: center;

            color: #59677e;

            font-size: 9px;
        }


        /* =====================================================
           ANIMATIONS
           ===================================================== */

        @keyframes doctorFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes glowOne {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(35px, -25px);
            }
        }

        @keyframes glowTwo {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25px, 25px);
            }
        }

        @keyframes loginAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 900px) {

            .left-panel {
                width: 45%;
            }

            .right-panel {
                width: 55%;

                padding: 25px;
            }

            .left-panel img {
                width: 75%;
            }

            .doctor-caption h2 {
                font-size: 21px;
            }

            .login-box {
                padding: 32px 28px;
            }
        }


        /* =====================================================
           MOBILE
           IMPORTANT:
           DOCTOR IMAGE IS NOT HIDDEN
           ===================================================== */

        @media (max-width: 650px) {

            html,
            body {
                width: 100%;
                min-height: 100dvh;

                overflow-x: hidden;
            }

            .auth-container {
                width: 100%;

                min-height: 100dvh;

                display: flex;

                flex-direction: column;

                background:
                    radial-gradient(
                        circle at 50% 15%,
                        rgba(79, 140, 255, 0.13),
                        transparent 35%
                    ),
                    #070c18;
            }


            /* =============================================
               MOBILE DOCTOR AREA
               ============================================= */

            .left-panel {
                width: 100%;

                height: 38dvh;

                min-height: 255px;
                max-height: 330px;

                flex-shrink: 0;

                border-right: none;

                border-bottom:
                    1px solid rgba(148, 163, 184, 0.10);

                justify-content: center;

                padding-top: 35px;
            }


            .brand-box {
                top: 15px;
                left: 18px;

                gap: 9px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;

                border-radius: 10px;

                font-size: 16px;
            }

            .brand-name {
                font-size: 15px;
            }

            .brand-sub {
                font-size: 7px;

                letter-spacing: 1px;
            }


            .doctor-wrap {
                height: 100%;
            }


            .doctor-glow {
                width: 230px;
                height: 230px;
            }


            .left-panel img {
                width: min(70%, 250px);

                max-width: 250px;

                max-height: 220px;

                object-fit: contain;
            }


            .doctor-caption {
                bottom: 13px;
            }

            .doctor-caption h2 {
                font-size: 17px;

                margin-bottom: 2px;
            }

            .doctor-caption p {
                font-size: 8px;

                letter-spacing: 0.8px;
            }

            .status-line {
                margin-top: 4px;

                font-size: 8px;
            }

            .status-dot {
                width: 5px;
                height: 5px;
            }


            /* =============================================
               MOBILE LOGIN
               ============================================= */

            .right-panel {
                width: 100%;

                min-height: 62dvh;

                flex: 1;

                padding: 18px 14px;

                align-items: flex-start;

                justify-content: center;

                overflow-y: auto;
            }


            .login-box {
                width: 100%;

                max-width: 430px;

                padding: 25px 20px;

                border-radius: 20px;

                margin: auto 0;
            }


            .login-icon {
                width: 42px;
                height: 42px;

                margin-bottom: 13px;

                border-radius: 12px;

                font-size: 19px;
            }


            .login-box h3 {
                font-size: 22px;

                margin-bottom: 5px;
            }

            .login-box .subtitle {
                font-size: 11px;

                margin-bottom: 20px;
            }


            .form-control {
                height: 46px;

                min-height: 46px;

                font-size: 12px;

                padding-left: 40px;

                border-radius: 11px;
            }


            .input-icon {
                left: 14px;

                font-size: 12px;
            }


            .btn-login {
                height: 46px;

                min-height: 46px;

                font-size: 12px;

                border-radius: 11px;
            }


            .toggle {
                margin-top: 15px;

                font-size: 10px;
            }


            .security-note {
                margin-top: 15px;

                padding-top: 11px;

                font-size: 7px;
            }
        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media (max-width: 390px) {

            .left-panel {
                height: 36dvh;

                min-height: 235px;

                max-height: 290px;
            }

            .left-panel img {
                width: min(68%, 220px);

                max-height: 185px;
            }

            .doctor-caption {
                bottom: 9px;
            }

            .doctor-caption h2 {
                font-size: 15px;
            }

            .doctor-caption p {
                font-size: 7px;
            }

            .right-panel {
                min-height: 64dvh;

                padding: 12px 12px;
            }

            .login-box {
                padding: 22px 17px;

                border-radius: 18px;
            }

            .login-icon {
                width: 38px;
                height: 38px;

                margin-bottom: 10px;
            }

            .login-box h3 {
                font-size: 20px;
            }

            .login-box .subtitle {
                font-size: 10px;

                margin-bottom: 16px;
            }

            .form-control {
                height: 43px;

                min-height: 43px;

                font-size: 11px;
            }

            .btn-login {
                height: 43px;

                min-height: 43px;

                font-size: 11px;
            }

            .toggle {
                font-size: 9px;
            }

            .security-note {
                font-size: 6.5px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 340px) {

            .left-panel {
                height: 34dvh;

                min-height: 220px;
            }

            .left-panel img {
                width: 62%;

                max-height: 165px;
            }

            .brand-box {
                top: 11px;
                left: 13px;
            }

            .brand-icon {
                width: 30px;
                height: 30px;

                font-size: 14px;
            }

            .brand-name {
                font-size: 13px;
            }

            .brand-sub {
                font-size: 6px;
            }

            .doctor-caption h2 {
                font-size: 14px;
            }

            .right-panel {
                padding: 10px;
            }

            .login-box {
                padding: 19px 14px;
            }

            .login-box h3 {
                font-size: 19px;
            }

            .form-control {
                height: 41px;
                min-height: 41px;
            }

            .btn-login {
                height: 41px;
                min-height: 41px;
            }
        }


        /* =====================================================
           TOUCH DEVICES
           ===================================================== */

        @media (hover: none) and (pointer: coarse) {

            .left-panel img:hover {
                transform: none;
            }

            .btn-login:hover {
                transform: none;
            }
        }

    </style>
</head>


<body>

<div class="auth-container">


    <!-- =====================================================
         LEFT / DOCTOR
         ===================================================== -->

    <div class="left-panel">


        <!-- BRAND -->

        <div class="brand-box">

            <div class="brand-icon">
                ♥
            </div>

            <div>
                <div class="brand-name">
                    Dr. AI
                </div>

                <div class="brand-sub">
                    Medical Intelligence
                </div>
            </div>

        </div>


        <!-- DOCTOR -->

        <div class="doctor-wrap">

            <div class="doctor-glow"></div>

            <img
                src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png"
                alt="Dr AI Medical Assistant">

        </div>


        <!-- CAPTION -->

        <div class="doctor-caption">

            <h2>
                Intelligent Healthcare
            </h2>

            <p>
                AI-powered medical assistance
            </p>

            <div class="status-line">

                <span class="status-dot"></span>

                Medical Intelligence Active

            </div>

        </div>

    </div>



    <!-- =====================================================
         RIGHT / LOGIN
         ===================================================== -->

    <div class="right-panel">


        <div class="login-box">


            <!-- LOGIN HEADER -->

            <div class="login-header">

                <div class="login-icon">
                    ♥
                </div>

                <h3>
                    Welcome Back!
                </h3>

                <p class="subtitle">
                    Login to your Dr. AI account
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="input-group-custom">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="Email Address"
                        autocomplete="email"
                        required>

                </div>


                <div class="input-group-custom">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-login">

                    Login to Dr. AI

                </button>

            </form>



            <!-- SIGNUP FORM -->

            <form
                id="signupForm"
                style="display:none;">


                <div class="input-group-custom">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Full Name"
                        required>

                </div>


                <div class="input-group-custom">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="Email Address"
                        required>

                </div>


                <div class="input-group-custom">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-login">

                    Create Account

                </button>

            </form>



            <!-- TOGGLE -->

            <div class="toggle text-center">

                <span id="toggleText">
                    Don't have an account?
                </span>

                &nbsp;

                <span
                    onclick="toggleForm()"
                    id="toggleBtn">

                    Sign Up

                </span>

            </div>



            <!-- SECURITY -->

            <div class="security-note">

                🔒 Your information is kept secure.
                Dr. AI is not a substitute for professional medical advice.

            </div>

        </div>

    </div>

</div>



<script>

    let loginForm =
        document.getElementById("loginForm");

    let signupForm =
        document.getElementById("signupForm");

    let toggleText =
        document.getElementById("toggleText");

    let toggleBtn =
        document.getElementById("toggleBtn");


    function toggleForm() {

        if (loginForm.style.display === "none") {

            loginForm.style.display = "block";

            signupForm.style.display = "none";

            toggleText.innerHTML =
                "Don't have an account?";

            toggleBtn.innerHTML =
                "Sign Up";

        } else {

            loginForm.style.display = "none";

            signupForm.style.display = "block";

            toggleText.innerHTML =
                "Already have an account?";

            toggleBtn.innerHTML =
                "Login";
        }
    }


    /* LOGIN → DR AI CHAT */

    loginForm.addEventListener(
        "submit",
        function(e) {

            e.preventDefault();

            window.location.href =
                "/dr_ai_chat";
        }
    );

</script>

</body>
</html>
