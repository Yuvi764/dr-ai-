<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr AI Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ================================
   DR. AI LOGIN - RESPONSIVE DESIGN
   ================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #070b16;
    overflow-x: hidden;
}


/* ================================
   MAIN CONTAINER
   ================================ */

.auth-container {
    min-height: 100vh;
    min-height: 100dvh;

    width: 100%;

    display: flex;
}


/* ================================
   LEFT SIDE
   ================================ */

.left-panel {
    width: 50%;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            rgba(79, 140, 255, 0.12),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #101827,
            #080c16
        );

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;
}


/* Decorative glow */

.left-panel::before {
    content: "";

    position: absolute;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: rgba(79, 140, 255, 0.12);

    filter: blur(80px);

    animation: glowMove 5s ease-in-out infinite;
}

.left-panel::after {
    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background: rgba(139, 92, 246, 0.12);

    filter: blur(70px);

    bottom: 10%;
    right: 10%;

    animation: glowMove2 6s ease-in-out infinite;
}


/* Image */

.left-panel img {
    width: min(60%, 420px);

    max-width: 420px;

    position: relative;

    z-index: 2;

    filter:
        drop-shadow(0 20px 40px rgba(0, 0, 0, 0.35));

    transition: 0.4s ease;

    animation: doctorFloat 4s ease-in-out infinite;
}

.left-panel img:hover {
    transform: scale(1.05);
}


/* ================================
   RIGHT PANEL
   ================================ */

.right-panel {
    width: 50%;
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 30px;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(79, 140, 255, 0.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #111827,
            #0b1020
        );

    position: relative;

    overflow: hidden;
}


/* Background glow */

.right-panel::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(139, 92, 246, 0.10);

    filter: blur(90px);

    top: -100px;
    right: -100px;
}


/* ================================
   LOGIN BOX
   ================================ */

.login-box {
    width: 100%;
    max-width: 390px;

    padding: 38px 35px;

    border-radius: 24px;

    background:
        rgba(20, 28, 45, 0.82);

    border: 1px solid rgba(148, 163, 184, 0.14);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.4),
        0 0 35px rgba(79, 140, 255, 0.05);

    position: relative;

    z-index: 2;

    animation: boxAppear 0.7s ease;
}


/* Top glowing line */

.login-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #4f8cff,
            #8b5cf6,
            transparent
        );

    border-radius: 10px;
}


/* ================================
   HEADING
   ================================ */

.login-box h3 {
    margin-bottom: 8px;

    font-size: 26px;

    font-weight: 700;

    color: #ffffff;
}

.login-box p {
    color: #8995aa;

    margin-bottom: 25px;
}


/* ================================
   INPUT
   ================================ */

.form-control {
    width: 100%;

    border-radius: 13px;

    padding: 12px 16px;

    min-height: 48px;

    border: 1px solid rgba(148, 163, 184, 0.15);

    background:
        rgba(15, 23, 42, 0.75);

    color: white;

    transition: 0.25s ease;
}

.form-control::placeholder {
    color: #66738a;
}

.form-control:focus {
    background:
        rgba(15, 23, 42, 0.95);

    color: white;

    border-color: #4f8cff;

    box-shadow:
        0 0 0 3px rgba(79, 140, 255, 0.10),
        0 0 20px rgba(79, 140, 255, 0.08);

    outline: none;
}


/* ================================
   LOGIN BUTTON
   ================================ */

.btn-login {
    width: 100%;

    min-height: 48px;

    border-radius: 13px;

    border: none;

    background:
        linear-gradient(
            135deg,
            #4f8cff,
            #7c5ce8
        );

    color: white;

    font-weight: 600;

    transition: 0.3s ease;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(79, 140, 255, 0.18);
}


/* Button shine */

.btn-login::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.25),
            transparent
        );

    transform: skewX(-20deg);

    transition: 0.6s;
}

.btn-login:hover::before {
    left: 130%;
}

.btn-login:hover {
    color: white;

    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(79, 140, 255, 0.30);
}

.btn-login:active {
    transform: scale(0.98);
}


/* ================================
   TOGGLE
   ================================ */

.toggle {
    font-size: 13px;

    color: #7f8ba0;

    margin-top: 8px;
}

.toggle span {
    cursor: pointer;

    color: #72a7ff;

    text-decoration: none;

    font-weight: 600;

    transition: 0.2s ease;
}

.toggle span:hover {
    color: #a78bfa;

    text-shadow:
        0 0 10px rgba(139, 92, 246, 0.4);
}


/* ================================
   ANIMATIONS
   ================================ */

@keyframes doctorFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

@keyframes glowMove {

    0%,
    100% {
        transform: translate(0, 0);
    }

    50% {
        transform: translate(40px, -30px);
    }
}

@keyframes glowMove2 {

    0%,
    100% {
        transform: translate(0, 0);
    }

    50% {
        transform: translate(-30px, 30px);
    }
}

@keyframes boxAppear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* ==================================================
   TABLET
   ================================================== */

@media (max-width: 900px) {

    .auth-container {
        min-height: 100dvh;
    }

    .left-panel {
        width: 42%;
    }

    .right-panel {
        width: 58%;

        padding: 25px;
    }

    .left-panel img {
        width: 70%;
    }

    .login-box {
        max-width: 360px;

        padding: 32px 28px;
    }
}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 650px) {

    html,
    body {
        width: 100%;

        min-height: 100dvh;

        overflow-x: hidden;
    }

    .auth-container {
        width: 100%;

        min-height: 100dvh;

        display: flex;

        flex-direction: column;
    }


    /* Hide image on phone */

    .left-panel {
        display: none;
    }


    /* Full width login */

    .right-panel {
        width: 100%;

        min-height: 100dvh;

        padding: 20px 16px;

        display: flex;

        align-items: center;

        justify-content: center;
    }


    .login-box {
        width: 100%;

        max-width: 420px;

        padding: 30px 22px;

        border-radius: 20px;
    }


    .login-box h3 {
        font-size: 23px;
    }


    .login-box p {
        font-size: 13px !important;

        margin-bottom: 20px;
    }


    .form-control {
        min-height: 47px;

        font-size: 14px;
    }


    .btn-login {
        min-height: 47px;

        font-size: 14px;
    }


    .toggle {
        font-size: 12px;
    }
}


/* ==================================================
   SMALL PHONES
   ================================================== */

@media (max-width: 400px) {

    .right-panel {
        padding: 14px;
    }

    .login-box {
        padding: 25px 18px;

        border-radius: 18px;
    }

    .login-box h3 {
        font-size: 21px;
    }

    .form-control {
        min-height: 44px;

        padding: 10px 13px;

        font-size: 13px;
    }

    .btn-login {
        min-height: 44px;

        font-size: 13px;
    }

    .toggle {
        font-size: 11px;
    }
}


/* ==================================================
   VERY SMALL PHONES
   ================================================== */

@media (max-width: 340px) {

    .right-panel {
        padding: 10px;
    }

    .login-box {
        padding: 22px 15px;
    }

    .login-box h3 {
        font-size: 19px;
    }

    .form-control {
        min-height: 42px;
    }

    .btn-login {
        min-height: 42px;
    }
}


/* ==================================================
   TOUCH DEVICES
   ================================================== */

@media (hover: none) and (pointer: coarse) {

    .btn-login:hover {
        transform: none;
    }

    .left-panel img:hover {
        transform: none;
    }
}
</style>
</head>

<body>

<div class="auth-container">

<!-- LEFT SIDE IMAGE -->

<div class="left-panel">

<img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">

</div>


<!-- RIGHT SIDE LOGIN -->

<div class="right-panel">

<div class="login-box">

<h3>Welcome Back!</h3>
<p style="font-size:14px">Login Your Account</p>

<!-- LOGIN FORM -->

<form id="loginForm">

<input type="email" class="form-control mb-3" placeholder="Email Address" required>

<input type="password" class="form-control mb-3" placeholder="Password" required>

<button class="btn btn-login mb-3">Login</button>

</form>


<!-- SIGNUP FORM -->

<form id="signupForm" style="display:none;">

<input type="text" class="form-control mb-3" placeholder="Full Name" required>

<input type="email" class="form-control mb-3" placeholder="Email Address" required>

<input type="password" class="form-control mb-3" placeholder="Password" required>

<button class="btn btn-login mb-3">Sign Up</button>

</form>


<div class="toggle text-center">

<span id="toggleText">Don't have an account?</span>

<span onclick="toggleForm()" id="toggleBtn">Sign Up</span>

</div>

</div>

</div>

</div>


<script>

let loginForm=document.getElementById("loginForm")
let signupForm=document.getElementById("signupForm")
let toggleText=document.getElementById("toggleText")
let toggleBtn=document.getElementById("toggleBtn")

function toggleForm(){

if(loginForm.style.display==="none"){

loginForm.style.display="block"
signupForm.style.display="none"

toggleText.innerHTML="Don't have an account?"
toggleBtn.innerHTML="Sign Up"

}

else{

loginForm.style.display="none"
signupForm.style.display="block"

toggleText.innerHTML="Already have an account?"
toggleBtn.innerHTML="Login"

}

}

loginForm.addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "/dr_ai_chat";
});
</script>

</body>
</html>
